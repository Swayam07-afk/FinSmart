<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    // SPA fallback redirect preserving query and hash across root and sub-path deployments
    const pathname = window.location.pathname;
    const isGhPages = pathname.toLowerCase().includes('/finsmart');
    const basePath = isGhPages ? '/FinSmart/' : '/';
    window.location.replace(basePath + window.location.search + window.location.hash);
  </script>
  <title>Redirecting to FinSmart...</title>
</head>
<body class="bg-slate-50 font-sans text-center py-20">
  <p class="text-slate-600">Loading FinSmart...</p>
</body>
</html>
